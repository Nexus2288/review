<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font:16px/1.5 system-ui,sans-serif; background:#f6f7fb; color:#111827; margin:0; padding:20px; }
  .box { max-width:420px; margin:0 auto; background:#fff; border-radius:16px; padding:20px; text-align:center; border:1px solid #e5e7eb; }
  input, select, button { font:inherit; padding:12px; border-radius:10px; border:1px solid #d1d5db; width:100%; margin:6px 0; }
  button { background:#2563eb; color:#fff; border:0; font-weight:600; cursor:pointer; }
  #qr { display:flex; justify-content:center; margin:16px 0; }
  small { color:#6b7280; word-break:break-all; }
  @media print { input, select, button, h2, .noprint { display:none; } body { background:#fff; } .box { border:0; } }
</style>
</head>
<body>
<div class="box">
  <h2>Business QR code</h2>
  <select id="slug"></select>
  <button id="make">Generate QR</button>
  <div id="qr"></div>
  <p id="name" style="font-weight:600"></p>
  <small id="link"></small>
  <button id="dl" class="noprint" style="display:none">Download PNG</button>
  <button id="pr" class="noprint" style="display:none" onclick="print()">Print</button>
</div>
<script>
let all = {};
fetch('businesses.json').then(r => r.json()).then(j => {
  all = j;
  const s = document.getElementById('slug');
  s.innerHTML = Object.keys(j).map(k => `<option value="${k}">${j[k].name} (${k})</option>`).join('');
  const q = new URLSearchParams(location.search).get('b');
  if (q && j[q]) { s.value = q; make(); }
});
function make() {
  const slug = document.getElementById('slug').value;
  const url = location.origin + '/?b=' + slug;
  const el = document.getElementById('qr'); el.innerHTML = '';
  new QRCode(el, { text: url, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('name').textContent = all[slug].name;
  document.getElementById('link').textContent = url;
  document.getElementById('dl').style.display = 'block';
  document.getElementById('pr').style.display = 'block';
}
document.getElementById('make').onclick = make;
document.getElementById('dl').onclick = () => {
  const c = document.querySelector('#qr canvas');
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = document.getElementById('slug').value + '-qr.png';
  a.click();
};
</script>
</body>
</html>
